<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=1" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png?v=1" />
    <link rel="apple-touch-icon" href="/favicon-256.png?v=1" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a1120" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e7ecf4" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Mecanízame — gestión de clientes, vehículos, órdenes y servicios para talleres mecánicos." />
    <title>Mecanízame</title>
    <script>
      // Aplica el tema guardado antes del primer paint (evita FOUC).
      (function () {
        try {
          var stored = localStorage.getItem('taller-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.add(theme);
          root.style.colorScheme = theme;
          document.documentElement.style.setProperty('--boot-bg', theme === 'light' ? '#e7ecf4' : '#0a1120');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        html, body { background-color: var(--boot-bg, #0a1120); margin: 0; padding: 0; }
        .initial-loader {
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          height: 100vh; width: 100vw; font-family: system-ui, -apple-system, sans-serif;
        }
        .loader-logo {
          width: 112px; height: 112px; margin-bottom: 22px; border-radius: 20px; background: #fff;
          padding: 12px; box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
          animation: logo-pulse 2s infinite ease-in-out;
        }
        @keyframes logo-pulse {
          0%, 100% { transform: scale(1); opacity: 0.9; }
          50% { transform: scale(1.06); opacity: 1; }
        }
      </style>
      <div class="initial-loader">
        <img src="/logo-mark.png?v=1" class="loader-logo" alt="Mecanízame" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
